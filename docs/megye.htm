<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<style>
		code {
        display: block;
        background-color: lightgray;
        font-family: "IBM Plex Mono", monospace;
        font-weight: normal;
        font-style: italic;
		}
	</style>
</head>
<body>
	<h1>Megyei statisztika</h1>
	<p><form><table>
		<tr><th><label for="user">GeoCaching felhasználói azonosító:</label></th><th><input name="user" id="user" size="10" type="text" inputmode="numeric" pattern="\d*" required  oninput="myScript()" /></th></tr>
		<tr>
			<td>Stílus választás:</td>
			<td>Megjelenített elemek:</td>
		</tr><tr>
			<td>
				<label for="stil1">Pacman style</label><input name="stil" id="stil1" type="radio" value="0" onclick="myScript()" checked="checked"><br />
				<label for="stil2">Shade style</label><input name="stil" id="stil2" type="radio" value="1" onclick="myScript()">
			</td><td>
				<label for="with1">Folyók és tavak</label><input name="with1" id="with1" type="checkbox" value="1" onclick="myScript()" checked="checked"><br/>
				<label for="with2">Autópályák</label><input name="with2" id="with2" type="checkbox" value="2" onclick="myScript()" checked="checked"><br/>
				<label for="with3">Vasút vonalak</label><input name="with3" id="with3" type="checkbox" value="4" onclick="myScript()">
			</td>
		</tr>
		<tr><td colspan=2><input id="url" type="text" size="200" /></td></tr>
	</table></form></p>
	<p>
		Bármelyik kódot szeretnéd használni, erre mindig szükséged lesz:
		<br /> xxyyzz helyére írd a saját user azonosítódat!
	</p>
	<p><code>
		&lt;script&gt;var myUserId = xxyyzz;&lt;/script&gt;
		&lt;script src="https://csalos.github.io/geocaching/megye.js"&gt;&lt;/script&gt;
	</code><br/></p>

	<script>
		function myScript() {
			const u = document.getElementById("user").value;
			const s = document.getElementById("stil2").checked;
			const w1 = document.getElementById("with1").checked;
			const w2 = document.getElementById("with2").checked;
			const w3 = document.getElementById("with3").checked;
			const o = document.getElementById("url");

			const url =  `https://csalos.github.io/geocaching/megye.js?myUserId=${u}${(s?"&getStyle=color":"")}${(!w1?"&getWater=0":"")}${(!w2?"&getRoads=0":"")}${(w3?"&getRails=1":"")}`;

			o.value = "<script src='" + url + "'><\/script>"

			//  1. Ha már létezik egy korábban betöltött dinamikus script, töröljük le
			const regiScript = document.getElementById('dinamikus-megye-script');
			const regiTerkep = document.getElementById('megyeterkep');
			if (regiScript)	regiScript.remove();
			if (regiTerkep)	regiTerkep.remove();
			
			// 2. Új <script> elem létrehozása a memóriában
		    const ujScript = document.createElement('script');
		    ujScript.id = 'dinamikus-megye-script'; // Adunk neki egy ID-t, hogy később megtaláljuk
		    ujScript.src = url;
		    ujScript.async = true; // Biztosítja, hogy ne fagyassza le az oldalt betöltés közben
		
		    // 3. (Opcionális) Megvárhatjuk, amíg a script teljesen lefut
		    ujScript.onload = function() {
		        console.log("A megye.js sikeresen lefutott az új adatokkal!");
		    };
		
		    // 4. Beszúrás a HTML dokumentumba (ekkor indul el a letöltés és futás)
		    document.body.appendChild(ujScript);
		}
	</script>
	
</body>
</html>
