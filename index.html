<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<style>
			body, iframe {				
    			clear: both;
				background-color: #e8e8bf;
				border: 0px;
				margin:  0px;
				padding: 0px;
				text-align: center;
			}
			ul {
				align: center;
				display: inline-block;
			}
			iframe {
				height: calc(100vh - 72px);
				width:  calc(100vw - 12px);
			}
		</style>
	</head>
	<body>
		<b><ul>
			<il><a href="#hod">Elrejtés gomb</a></il> - 
			<il><a href="#megye">Megyei statisztika</a></il> - 
			<il><a href="#coll">Kollekciók</a></il>
		</ul></b><hr />
		<iframe name="frm" id="frm" src=""></iframe>
		<script>
			//  Összekötjük a hash neveket a valódi aloldalakkal
			const oldalak = {
			    '#hod':   'docs/HoD.htm',
			    '#megye': 'docs/megye.htm',
			    '#coll':  'docs/collection.htm'
			};
			
			const iframe = document.getElementById('frm');
			
			// Frissítjük az iframe-et az URL alapján
			function subFrame() {
			    const aktualisHash = window.location.hash;
			    
			    // Ha a hash szerepel a listánkban, betöltjük az ahhoz tartozó oldalt
			    if (oldalak[aktualisHash]) {
			        iframe.src = oldalak[aktualisHash];
			    } else {
			        // Ha nincs hash az URL-ben, akkor a alapértelmezett nyílik meg
			        iframe.src = oldalak['#megye'];
			    }
			}
			window.addEventListener('hashchange', subFrame);
			window.addEventListener('load', subFrame);
		</script>
	</body>
</html>
