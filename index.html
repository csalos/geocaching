<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<style>
			body, iframe {				
    			clear: both;
				background-color: #e8e8bf;
				border: 0px;
				margin:  0px;
				padding: 0px;
				text-align: center;
			}
			ul {
				align: center;
				display: inline-block;
			}
			iframe {
				height: calc(100vh - 72px);
				width:  calc(100vw - 12px);
			}
		</style>
	</head>
	<body>
		<b><ul>
			<il><a href="#hod">Elrejtés gomb</a></il> - 
			<il><a href="megye">Megyei statisztika</a></il> - 
			<il><a href="coll">Kollekciók</a></il>
		</ul></b><hr />
		<iframe name="frm" id="frm" src="docs/megye.htm"></iframe>
		<script>
			// 1. Összekötjük a hash neveket a valódi fájlokkal
			const oldalak = {
			    '#hod':   'docs/HoD.htm',
			    '#megye': 'docs/megye.htm',
			    '#coll':  'docs/collection.ht'
			};
			
			const iframe = document.getElementById('frm');
			
			// 2. Ez a függvény frissíti az iframe-et az URL alapján
			function subFrame() {
			    const aktualisHash = window.location.hash; // pl. "#rolunk"
			    
			    // Ha a hash szerepel a listánkban, betöltjük az ahhoz tartozó oldalt
			    if (oldalak[aktualisHash]) {
			        iframe.src = oldalak[aktualisHash];
			    } else {
			        // Ha nincs hash az URL-ben, akkor a beállított alapértelmezett (főoldal) nyílik meg
			        iframe.src = oldalak['#fooldal'];
			    }
			}
			
			// 3. FIGYELŐK (Eseménykezelők)
			
			// A: Figyeljük, ha a felhasználó közvetlenül az URL-be írja vagy linkről érkezik
			window.addEventListener('hashchange', subFrame);
			window.addEventListener('load', subFrame);
			
			// B: Figyeljük, ha a felhasználó a menüből (select) választ (opcionális, de hasznos!)
			valaszto.addEventListener('change', function() {
			    // Amikor a menüben kattint, átírjuk az URL-ben a hash-t.
			    // Ez automatikusan beindítja a 'hashchange' figyelőt, ami frissíti az iframe-et!
			    window.location.hash = this.value; 
			});
		</script>
	</body>
</html>
